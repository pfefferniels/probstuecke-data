name: Check encodings

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download Jing
        run: curl -sSfL -o "$RUNNER_TEMP/jing.jar" https://repo1.maven.org/maven2/org/relaxng/jing/20241231/jing-20241231.jar

      - name: Validate against the schemas
        env:
          JING_JAR: ${{ runner.temp }}/jing.jar
        run: scripts/validate.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check internal references
        run: |
          pip install lxml
          python scripts/check_references.py

      - name: Check accidentals
        run: python scripts/check_accidentals.py

      - name: Check the bar labels of the music examples
        run: python scripts/label_example_bars.py --check

      - name: Check the facsimile links
        run: python scripts/check_facsimile.py

      - name: Check the alignment of the translations
        run: python scripts/check_alignment.py

  # Once main has passed the checks, the website (probstuecke-digital) updates
  # its submodule to it and is deployed again. See "Updating the website" in
  # the README.
  update-website:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Ask probstuecke-digital to update the data
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::The secret WEBSITE_DISPATCH_TOKEN is not set, so the website is not updated. See \"Updating the website\" in the README."
            exit 0
          fi
          gh api repos/pfefferniels/probstuecke-digital/dispatches -f event_type=data-updated
